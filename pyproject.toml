[project]
name = "blent-ai-llm-support-classifier"
version = "0.1.0"
description = "LLM fine-tuning for multilingual customer support ticket classification"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "torch>=2.0",
    "transformers>=4.40",
    "datasets>=2.19",
    "trl>=0.8",
    "peft>=0.10",
    "bitsandbytes>=0.43",
    "accelerate>=0.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.indexes]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
